<title>Memoria Verbi</title>
<meta name="apple-mobile-web-app-title" content="Memoria Verbi">
<meta name="application-name" content="Memoria Verbi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0a16;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.07);--line:rgba(255,255,255,.09);
  --text:#eeedf7;--mute:#9b98b6;--a1:#b794ff;--a2:#ff7ab6;--ok:#3ee0a1;--bad:#ff6b81;--warn:#ffc35c;
  --r:18px;--disp:'Fraunces',Georgia,serif;--ui:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;
}
body.verb{--a1:#4fe0c4;--a2:#5aa8ff}
body.mix{--a1:#9d8cff;--a2:#4fe0c4}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--ui);color:var(--text);min-height:100vh;
  background:var(--bg);
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;
}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1100px 620px at 8% -12%, color-mix(in srgb,var(--a1) 26%,transparent),transparent 62%),
    radial-gradient(900px 560px at 105% 0%, color-mix(in srgb,var(--a2) 18%,transparent),transparent 60%),
    radial-gradient(700px 500px at 50% 120%, color-mix(in srgb,var(--a1) 10%,transparent),transparent 70%);
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
.page[hidden]{display:none!important}
.hhead{text-align:center;padding:40px 0 30px}
.logo.xl{width:72px;height:72px;font-size:36px;border-radius:22px;margin:0 auto 18px}
.hhead h1{font-family:var(--disp);font-size:clamp(34px,7vw,52px);margin:0;letter-spacing:-.02em}
.hhead p{color:var(--mute);margin:8px 0 0;font-size:16px}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;max-width:860px;margin:0 auto}
.pcard,.lcard{position:relative;text-align:left;display:flex;flex-direction:column;gap:10px;padding:26px 24px;border-radius:24px;background:var(--panel);border:1px solid var(--line);overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s}
.pcard::before,.lcard::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,#b794ff,#ff7ab6)}
.pcard.g::before{background:linear-gradient(90deg,#4f46e5,#7c3aed,#db2777)}
.pcard:hover,.lcard:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.2);box-shadow:0 24px 50px -28px #b794ff}
.pi{font-size:34px;line-height:1}
.pcard h2,.lcard h2{font-family:var(--disp);font-size:26px;margin:0;letter-spacing:-.01em}
.lcard h2 em{font-weight:500;opacity:.85}
.pcard p,.lcard p{margin:0;color:var(--mute);font-size:14.5px;line-height:1.5}
.pm{display:flex;flex-wrap:wrap;gap:6px}
.pm span{font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;background:rgba(255,255,255,.07);color:var(--text)}
.pm span.ok{background:rgba(62,224,161,.14);color:#9ff5d2}
.pbar{height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--ok);transition:width .5s}
.go{margin-top:4px;font-weight:800;font-size:14px;background:linear-gradient(135deg,#b794ff,#ff7ab6);-webkit-background-clip:text;background-clip:text;color:transparent}
.lk{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#c4b5fd}
.ghead{display:flex;flex-direction:column;gap:14px;padding:10px 0 24px}
.ghead h1{font-family:var(--disp);font-size:clamp(28px,6vw,40px);margin:0}
.backbtn{align-self:flex-start;font-size:13px;font-weight:700;padding:8px 13px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--mute)}
.backbtn:hover{color:var(--text)}
.homerow{margin-bottom:14px}
.fhome{flex:0 0 auto;width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:18px;font-weight:800;color:var(--text)}
.lessons{display:grid;gap:14px;max-width:760px}
.brand{cursor:pointer}
.fbar .logo{cursor:pointer}
@media (hover:none){.pcard:hover,.lcard:hover{transform:none}.pcard:active,.lcard:active{transform:scale(.98)}}
.wrap{max-width:1160px;margin:0 auto;overflow-x:clip;padding:calc(22px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 80px calc(18px + env(safe-area-inset-left))}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:22px;
  background:linear-gradient(135deg,var(--a1),var(--a2));color:#140f24;box-shadow:0 8px 30px -8px var(--a1)}
.brand h1{font-family:var(--disp);font-weight:700;font-size:26px;margin:0;letter-spacing:-.02em}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 14px;min-width:96px}
.stat b{display:block;font-size:18px;font-weight:800}
.stat span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;backdrop-filter:blur(14px)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:rgba(0,0,0,.25);padding:5px;border-radius:14px;margin-bottom:14px}
.seg button{padding:10px 8px;border-radius:10px;text-align:center;transition:.2s;color:var(--mute)}
.seg button b{display:block;font-weight:800;font-size:15px;color:var(--text)}
.seg button small{font-size:11px}
.seg button.on{background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 38%,transparent),color-mix(in srgb,var(--a2) 26%,transparent));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a1) 60%,transparent)}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.rowlab{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--mute);width:42px}
.tchip{position:relative;width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-weight:800;font-size:14px;color:var(--mute);overflow:hidden;transition:.15s}
.tchip:hover{border-color:color-mix(in srgb,var(--a1) 60%,transparent);color:var(--text)}
.tchip.on{background:color-mix(in srgb,var(--a1) 22%,transparent);border-color:color-mix(in srgb,var(--a1) 70%,transparent);color:var(--text)}
.tchip i{position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p)*100%);background:var(--ok)}
.scopebar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
.scopeact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mini{font-size:12px;font-weight:700;padding:7px 11px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.mini:hover{background:rgba(255,255,255,.1)}
.sw{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;cursor:pointer;user-select:none}
.sw input{display:none}
.sw span{width:34px;height:20px;border-radius:20px;background:rgba(255,255,255,.12);position:relative;transition:.2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--warn)}
.sw input:checked+span::after{left:17px}
.hint{font-size:11px;color:var(--mute);margin-top:4px}
.tabs{display:flex;gap:6px;margin:18px 0;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;color:var(--mute);border:1px solid transparent;transition:.15s;white-space:nowrap}
.tab:hover{color:var(--text);background:var(--panel)}
.tab.on{color:var(--text);background:var(--panel2);border-color:var(--line);box-shadow:0 0 0 1px color-mix(in srgb,var(--a1) 35%,transparent) inset}
.tab em{font-style:normal;margin-right:6px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;position:sticky;top:0;z-index:6;padding:10px 0 8px;padding-top:calc(10px + env(safe-area-inset-top));background:linear-gradient(var(--bg) 78%,transparent)}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;font-size:16px;padding:12px 14px 12px 40px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--text);font:inherit;outline:none}
.search input:focus{border-color:color-mix(in srgb,var(--a1) 70%,transparent)}
.search::before{content:"⌕";position:absolute;left:14px;top:50%;transform:translateY(-52%);color:var(--mute);font-size:20px}

<section id="giris">
  <h2><span class="n">0</span>Önce Türkçeden başlayalım</h2>
  <p>Aslında bu konuyu Türkçede her gün kullanıyorsun. Türkçede "<i>Üst katta <b>yaşayan</b> adam</i>" deriz: tek kelimelik bir sıfat-fiil (<b>-an / -en</b>) yeterli. İngilizce ise aynı şeyi uzun yoldan söyler:</p>
  <div class="pair">
    <div class="from">The man <span class="rc">who lives upstairs</span> … <span style="font-size:14px">(üst katta <u>yaşayan</u> adam)</span></div>
  </div>
  <p><b>Kısaltma (reduction)</b>, İngilizcedeki bu uzun "who / which" cümleciğini Türkçedeki gibi kısa bir yapıya çevirmektir:</p>
  <div class="pair"><div class="to">The man <b class="k">living</b> upstairs …</div></div>
  <div class="scroll">
  <table>
    <tr><th>Türkçe ek</th><th>Anlam</th><th>İngilizce karşılığı</th><th>Örnek</th></tr>
    <tr><td class="f">-an / -en</td><td>yapan (etken, aynı zaman)</td><td><b>V-ing</b></td><td>üreten → producing</td></tr>
    <tr><td class="f">-miş olan</td><td>yapmış olan (etken, önce)</td><td><b>having V3</b></td><td>üretmiş olan → having produced</td></tr>
    <tr><td class="f">-ilen / -ılan</td><td>yapılan (edilgen)</td><td><b>V3 / being V3</b></td><td>üretilen → produced</td></tr>
    <tr><td class="f">-ilmiş olan</td><td>yapılmış olan (edilgen, önce)</td><td><b>having been V3</b></td><td>üretilmiş olan → having been produced</td></tr>
  </table>
  </div>
  <div class="why"><strong>Bu tablo neden önemli?</strong> Bir kısaltmayı gördüğünde Türkçeye çevirip "<i>-en mi, -miş olan mı, -ilen mi?</i>" diye sorarsan doğru yapıyı neredeyse her zaman bulursun.</div>
</section>

<section id="temel">
  <h2><span class="n">1</span>Ön bilgi: Hangi cümlecik kısaltılır?</h2>
  <div class="goal"><b>Bu bölümün hedefi:</b> Bir who/which cümleciğinin kısaltılıp kısaltılamayacağını 3 saniyede anlamak.</div>
  <p>Kısaltmanın tek ön şartı şu: <b>who / which / that</b> bağlacı, cümleciğin <b>öznesi</b> olmalı. Bunu anlamanın yolu bağlacın hemen arkasına bakmaktır.</p>
  <div class="scroll">
  <table>
    <tr><th>Bağlaçtan sonra ne var?</th><th>Örnek</th><th>Kısaltılır mı?</th></tr>
    <tr><td><b>Fiil</b></td><td>The person who <u>lives</u> upstairs</td><td style="color:var(--green)">✓ Evet → living</td></tr>
    <tr><td><b>be</b> (is/are/was/were)</td><td>The man that <u>is</u> standing by the door</td><td style="color:var(--green)">✓ Evet → who + be silinir</td></tr>
    <tr><td><b>Özne</b> (I, he, they, the man…)</td><td>The book which <u>I</u> bought</td><td style="color:var(--red)">✗ Bu yolla kısaltılmaz; sadece <i>which</i> atılabilir → The book I bought</td></tr>
  </table>
  </div>
  <div class="ok"><strong>En basit kural:</strong> Bağlaçtan sonra <b>be</b> geliyorsa <b>bağlacı ve be'yi silmen</b> yeterli. Geriye V-ing kalırsa active, V3 kalırsa passive olur.<br>
  The man <s>that is</s> standing by the door → The man <b>standing</b> by the door<br>
  The man <s>who was</s> shot yesterday → The man <b>shot</b> yesterday</div>
  <h3>Kısaltma yaparken sorulacak 4 soru</h3>
  <div class="flow">
    <div class="fs"><span class="num">1</span><div><b>Bağlaçtan sonra fiil/be mi var?</b> Yoksa (özne varsa) dur, kısaltma yok.</div></div>
    <div class="fs"><span class="num">2</span><div><b>İsmin önünde the first / the second / the last / the only / the best / the most / -est var mı?</b> Varsa cevap <b>to V</b> ailesinden.</div></div>
    <div class="fs"><span class="num">3</span><div><b>Etken mi, edilgen mi?</b> İsim işi yapıyorsa active, işe maruz kalıyorsa passive (be + V3).</div></div>
    <div class="fs"><span class="num">4</span><div><b>Zaman farkı var mı?</b> Cümlecikteki eylem ana fiilden önce bitmişse <b>having / to have</b> eklenir.</div></div>
  </div>
  <h3>Kendini dene</h3>
  <div class="qset" data-set="temel"></div>
</section>

<section id="karar">
  <h2><span class="n">2</span>Karar sihirbazı</h2>
  <p class="sub">Elindeki cümle için soruları cevapla, sihirbaz hangi yapıyı kullanacağını söylesin. Kendi cümlelerini kontrol etmek için de kullanabilirsin.</p>
  <div class="wiz" id="wiz"></div>
</section>

<section id="active">
  <h2><span class="n">3</span>Active (Etken) kısaltma</h2>
  <div class="goal"><b>Bu bölümün hedefi:</b> V-ing ile having V3 arasındaki farkı zaman ilişkisine bakarak seçmek.</div>
  <div class="formula">V-ing (yapan) · having V3 (yapmış olan)</div>
  <p>İsim eylemi <b>kendisi yapıyorsa</b> active kısaltma kullanılır. İki seçenek var ve aralarındaki tek fark <b>zaman</b>:</p>
  <ul>
    <li><b>V-ing</b>: eylem ana fiille aynı zamanda oluyor ya da genel bir durum.</li>
    <li><b>having V3</b>: eylem ana fiilden <b>önce</b> olmuş ve bitmiş.</li>
  </ul>

  <h3>a) Aynı zaman / genel durum → V-ing</h3>
  <div class="stepper" data-ex="a1"></div>
  <div class="pair">
    <div class="from">The man <s>that is</s> standing by the door is talking on the phone.</div>
    <div class="to">The man <b class="k">standing</b> by the door is talking on the phone.</div>
    <div class="tr">Kapının yanında duran adam telefonla konuşuyor.</div>
  </div>
  <div class="pair">
    <div class="from">The car <s>which is</s> running is my car.</div>
    <div class="to">The car <b class="k">running</b> is my car.</div>
    <div class="tr">Çalışan araba benim arabam.</div>
  </div>
  <div class="pair">
    <div class="from">Most of the people who work in this company speak English.</div>
    <div class="to">Most of the people <b class="k">working</b> in this company speak English.</div>
  </div>
  <div class="pair">
    <div class="from">M. K. Atatürk, who founded<sup class="t">V2</sup> the Turkish Republic, was<sup class="t">V2</sup> the first teacher.</div>
    <div class="to">M. K. Atatürk, <b class="k">founding</b> the Turkish Republic, was the first teacher.</div>
    <div class="to"><b class="k">Founding</b> the Turkish Republic, M. K. Atatürk was the first teacher.</div>
  </div>
  <div class="tip"><strong>Püf:</strong> Atatürk örneğinde iki fiil de <b>V2</b>. Aralarındaki zaman farkı vurgulanmadığı için basit <b>V-ing</b> kullanıldı. Önceliği özellikle göstermek istersen <i>Having founded…</i> da doğrudur.</div>

  <h3>b) Eylem önce olmuşsa → having V3</h3>
  <div class="stepper" data-ex="a2"></div>
  <div class="pair">
    <div class="from">Jack, who graduated<sup class="t">V2</sup> from university last year, is<sup class="t">P</sup> hunting for a new job.</div>
    <div class="to">Jack, <b class="k">having graduated</b> from university last year, is hunting for a new job.</div>
    <div class="tr">Geçen yıl üniversiteden mezun olmuş olan Jack yeni bir iş arıyor.</div>
  </div>
  <div class="pair">
    <div class="from">The factory which produced millions of toys until recently is now producing cars.</div>
    <div class="to">The factory <b class="k">having produced</b> millions of toys until recently is now producing cars.</div>
  </div>
  <div class="pair">
    <div class="from">Bill Gates, who founded<sup class="t">V2</sup> Microsoft, is<sup class="t">P</sup> one of the richest people in the world.</div>
    <div class="to">Bill Gates, <b class="k">having founded</b> Microsoft, is one of the richest people in the world.</div>
    <div class="to"><b class="k">Having founded</b> Microsoft, Bill Gates is one of the richest people in the world.</div>
  </div>
  <div class="tip"><strong>Püf:</strong> Tahtadaki gibi fiillerin üstüne zamanını yaz. Cümlecik <b>V2</b>, ana fiil <b>P (present)</b> ise zaman farkı vardır → <b>having V3</b>. Zaman ifadeleri de ipucu verir: <i>last year, until recently, before 2000</i>.</div>
  <div class="why"><strong>Bilgi notu:</strong> Günlük İngilizcede virgülsüz (tanımlayıcı) cümleciklerde <i>having V3</i> pek kullanılmaz; anadili İngilizce olan biri genelde <i>The man who lived upstairs…</i> der. <i>having V3</i> en çok <b>virgüllü yapılarda</b> ve <b>cümle başında</b> görülür (<i>Jack, having graduated…</i> / <i>Having founded Microsoft, …</i>). Sınavda ise zaman farkını göstermek için doğru kabul edilir.</div>

  <h3>Alıştırma: Kısaltılmış halini yaz</h3>
  <div class="pset" data-set="active"></div>
</section>

<section id="passive">
  <h2><span class="n">4</span>Passive (Edilgen) kısaltma</h2>
  <div class="goal"><b>Bu bölümün hedefi:</b> İsim işe maruz kalıyorsa V3 ailesini seçmek ve V-ing tuzağına düşmemek.</div>
  <div class="formula">V3 / being V3 (yapılan) · having been V3 (yapılmış olan)</div>
  <div class="note"><span class="lbl">✎ Defterimden</span>
  <b>be + V3</b> olmadan edilgen (passive) olmaz. Kısaltmada sadece V3 görsen bile arkada silinmiş bir <i>be</i> vardır: <i>The man <s>who was</s> shot…</i> → <i>The man shot…</i></div>

  <h3>a) En sık kullanılan hali: sadece V3</h3>
  <div class="stepper" data-ex="p1"></div>
  <div class="pair">
    <div class="from">The car <s>which was</s> stolen last year was found yesterday.</div>
    <div class="to">The car <b class="k">stolen</b> last year was found yesterday.</div>
    <div class="tr">Geçen yıl çalınan araba dün bulundu.</div>
  </div>
  <div class="pair">
    <div class="from">The computer <s>that was</s> bought last year was broken last week.</div>
    <div class="to">The computer <b class="k">bought</b> last year was broken last week.</div>
    <div class="tr">Geçen yıl alınan bilgisayar geçen hafta bozuldu.</div>
  </div>

  <h3>b) Şu an devam ediyorsa → being V3</h3>
  <div class="pair">
    <div class="from">The bridge <s>which is being</s> built now will connect the two cities.</div>
    <div class="to">The bridge <b class="k">being built</b> now will connect the two cities.</div>
    <div class="tr">Şu an yapılmakta olan köprü iki şehri birbirine bağlayacak.</div>
  </div>

  <h3>c) Önceliği vurgulamak için → having been V3</h3>
  <div class="pair">
    <div class="from">The man who was shot yesterday is now in the hospital.</div>
    <div class="to">The man <b class="k">having been shot</b> yesterday is now in the hospital.</div>
  </div>
  <div class="pair">
    <div class="from">The car which had been stolen before 2000 was found yesterday.</div>
    <div class="to">The car <b class="k">having been stolen</b> before 2000 was found yesterday.</div>
  </div>
  <div class="pair">
    <div class="from">Microsoft, which was founded<sup class="t">V2</sup> by Bill Gates, is<sup class="t">P</sup> the largest software company in the world.</div>
    <div class="to">Microsoft, <b class="k">having been founded</b> by Bill Gates, is …</div>
    <div class="to"><b class="k">(Having been) founded</b> by Bill Gates, Microsoft is the largest software company …</div>
  </div>
  <div class="tip"><strong>Active mi passive mi? İki hızlı test:</strong><br>
  1) Kısaltmadan sonra <b>by</b> geliyorsa passive'dir (<i>founded <b>by</b> Bill Gates</i>).<br>
  2) Fiilden sonra <b>nesne</b> geliyorsa genelde active'dir (<i>having founded <b>Microsoft</b></i>).<br>
  3) Türkçeye çevir: "araba <b>çalan</b>" mı, "<b>çalınan</b> araba" mı? Araba kendisi çalmaz → passive → <b>stolen</b>.</div>
  <div class="warn"><strong>Tuzak:</strong> <s>The car <u>stealing</u> last year…</s> ✗ → "çalan araba" demiş olursun. Doğrusu: <b>stolen</b>.</div>

  <h3>Alıştırma</h3>
  <div class="pset" data-set="passive"></div>
</section>

<section id="first">
  <h2><span class="n">5</span>The first / the only / the last / superlative + to V</h2>
  <div class="goal"><b>Bu bölümün hedefi:</b> Sıra veya üstünlük bildiren bir ifade gördüğünde otomatik olarak "to V" ailesine geçmek.</div>
  <p>İsmin önünde aşağıdakilerden biri varsa kısaltma <b>V-ing / V3 ile değil, infinitive (to V) ile</b> yapılır:</p>
  <div class="formula">the only · the first · the second · the last · the best · the most · -est</div>
  <div class="why"><strong>Neden "to"?</strong> Bu kalıp İngilizcede sabittir. Türkçede "<i>Ay'da yürüyen <b>ilk</b> insan</i>" deriz. İngilizcede "ilk" kelimesi geldiğinde sıfat-fiil yerine infinitive kullanılır: <i>the first person <b>to walk</b> on the Moon</i>.</div>
  <table>
    <tr><th></th><th>Aynı zaman / genel</th><th>Önceden olmuş</th></tr>
    <tr><td class="f">Active</td><td><b>to V1</b><br><span style="font-size:13px;color:var(--muted)">yapan</span></td><td><b>to have V3</b><br><span style="font-size:13px;color:var(--muted)">yapmış olan</span></td></tr>
    <tr><td class="f">Passive</td><td><b>to be V3</b><br><span style="font-size:13px;color:var(--muted)">yapılan</span></td><td><b>to have been V3</b><br><span style="font-size:13px;color:var(--muted)">yapılmış olan</span></td></tr>
  </table>

  <h3>Active örnekler</h3>
  <div class="stepper" data-ex="f1"></div>
  <div class="pair">
    <div class="from">The first man who lived upstairs was a doctor.</div>
    <div class="to">The first man <b class="k">to live</b> upstairs was a doctor.</div>
    <div class="tr">Üst katta yaşayan ilk adam doktordu.</div>
  </div>
  <div class="pair">
    <div class="from">The only car which is running is my car.</div>
    <div class="to">The only car <b class="k">to run</b> is my car.</div>
  </div>
  <div class="pair">
    <div class="from">The first man who lived upstairs last year is living downstairs now.</div>
    <div class="to">The first man <b class="k">to have lived</b> upstairs last year is living downstairs.</div>
  </div>
  <div class="pair">
    <div class="from">The only man who graduated from university last year is now …</div>
    <div class="to">The only man <b class="k">to have graduated</b> from university last year is now …</div>
  </div>
  <div class="pair">
    <div class="from">Neil Armstrong was the first person who walked on the Moon.</div>
    <div class="to">Neil Armstrong was the first person <b class="k">to walk</b> on the Moon.</div>
  </div>

  <h3>Passive örnekler</h3>
  <div class="pair">
    <div class="from">The last man who was shot yesterday worked for me.</div>
    <div class="to">The last man <b class="k">to be shot</b> yesterday worked for me.</div>
    <div class="tr">Dün vurulan son adam benim için çalışıyordu.</div>
  </div>
  <div class="pair">
    <div class="from">The most expensive car which was stolen last year was found yesterday.</div>
    <div class="to">The most expensive car <b class="k">to be stolen</b> last year was found yesterday.</div>
  </div>
  <div class="pair">
    <div class="from">The only computer which has been bought lately is still working.</div>
    <div class="to">The only computer <b class="k">to be bought</b> lately is still working.</div>
  </div>
  <div class="pair">
    <div class="from">The oldest man who was shot yesterday is now in the hospital.</div>
    <div class="to">The oldest man <b class="k">to have been shot</b> yesterday is now in the hospital.</div>
  </div>
  <div class="tip"><strong>Püf:</strong> Tahtada aynı cümle iki şekilde yazıldı: <i>to be shot</i> ve <i>to have been shot</i>. İkisi de doğru. Sınavda en sık <b>to be V3</b> çıkar; <b>to have been V3</b> eylemin önce olduğunu özellikle vurgular.</div>
  <div class="warn"><strong>Tuzak:</strong> <s>The first man <u>calling</u> me…</s> ✗ → <i>The first man <b>to call</b> me…</i> ✓. "the first" gördüğün an V-ing şıklarını ele.</div>

  <h3>Alıştırma</h3>
  <div class="pset" data-set="first"></div>
</section>

<section id="tablo">
  <h2><span class="n">6</span>Büyük tablo: "produce" fiilinin 8 hali</h2>
  <p class="sub">Konunun tamamı bu tabloda. Ezberlemek yerine mantığını gör: satırlar "zaman", sütunlar "etken/edilgen".</p>
  <div class="scroll">
  <table>
    <tr><th>Yapı</th><th>Active</th><th>Türkçe</th><th>Passive</th><th>Türkçe</th></tr>
    <tr><td class="f">Participle (aynı zaman)</td><td>producing</td><td>üreten</td><td>produced / being produced</td><td>üretilen</td></tr>
    <tr><td class="f">Participle (önceden)</td><td>having produced</td><td>üretmiş olan</td><td>having been produced</td><td>üretilmiş olan</td></tr>
    <tr><td class="f">Infinitive (aynı zaman)</td><td>to produce</td><td>üreten</td><td>to be produced</td><td>üretilen</td></tr>
    <tr><td class="f">Infinitive (önceden)</td><td>to have produced</td><td>üretmiş olan</td><td>to have been produced</td><td>üretilmiş olan</td></tr>
  </table>
  </div>
  <div class="tip"><strong>Ezber formülü:</strong> Passive'in anahtarı her zaman <b>be + V3</b>. <i>being V3, to be V3, having been V3, to have been V3</i>: hepsinde be'nin bir hali + V3 var. "Önceden" anlamının anahtarı ise <b>have</b>: <i>having / to have</i>.</div>
</section>

<section id="basta">
  <h2><span class="n">7</span>Cümle başında kısaltma ve "Kim? / Ne?" kuralı</h2>
  <div class="goal"><b>Bu bölümün hedefi:</b> YDS cümle tamamlama sorularında doğru özneyi seçmek.</div>
  <p>Virgüllü bir kısaltma cümlenin başına alınabilir:</p>
  <div class="pair">
    <div class="from">Bill Gates, having founded Microsoft, is one of the richest people in the world.</div>
    <div class="to"><b class="k">Having founded Microsoft</b>, Bill Gates is one of the richest people in the world.</div>
  </div>
  <div class="note"><span class="lbl">✎ Defterimden</span>
  <b>V-ing</b> ya da <b>V3</b> ile başlayan cümle kısaltılmış bir cümledir. Cümle tamamlama sorularında bu kısaltmaya <b>"Kim?"</b> ve <b>"Ne?"</b> diye sorulur. Şıklardan, virgülden sonra bu soruya cevap veren özneyle başlayan seçenek işaretlenir.</div>
  <div class="stepper" data-ex="k1"></div>
  <div class="warn"><strong>Dangling (sarkık) yapı hatası:</strong> <s>Having founded Microsoft, the company grew fast.</s> → Kim kurdu? Şirket kendini kurmadı! Doğrusu: <i>Having founded Microsoft, <b>Bill Gates</b>…</i></div>
  <div class="tip"><strong>Püf:</strong> Şıklarda virgülden sonra <b>it, there, people</b> gibi genel öznelerle başlayan seçenekler genelde çeldiricidir. Kısaltmadaki eylemi gerçekten yapabilecek (ya da ona maruz kalabilecek) isim hangisiyse o şık doğrudur.</div>
  <h3>YDS tarzı sorular</h3>
  <div class="qset" data-set="basta"></div>
</section>

<section id="inf">
  <h2><span class="n">8</span>Infinitive (to V) kullanımları</h2>
  <div class="goal"><b>Bu bölümün hedefi:</b> "to"nun cümlede hangi görevle geldiğini tanımak: sahte özne, fiil kalıbı, amaç, edilgen + to.</div>

  <h3>8.1 It is + sıfat + to V1 / to be V3</h3>
  <div class="formula">It + be + adjective + to V1 / to be V3</div>
  <div class="pair"><div class="to">It is <b class="k">possible to pass</b> YDS.</div><div class="tr">YDS'yi geçmek mümkün.</div></div>
  <div class="pair"><div class="to">It is <b class="k">easy to pass</b> YDS.</div></div>
  <div class="pair"><div class="to">It is <b class="k">important to pass</b> YDS.</div></div>
  <div class="pair"><div class="to">It is <b class="k">possible to be killed</b> during an experiment.</div><div class="tr">Bir deney sırasında öldürülmek mümkündür. (passive)</div></div>
  <div class="why"><strong>Mantık:</strong> Buradaki <b>it</b> sahte öznedir; gerçek özne <i>to pass YDS</i>'dir. <i>To pass YDS is important.</i> = <i>It is important to pass YDS.</i> İngilizce uzun özneyi sona atmayı sever.</div>

  <h3>8.2 Fiil + nesne + to V1 (enable, allow, cause, force, motivate)</h3>
  <div class="formula">enable · allow · cause · force · motivate + nesne + to V1</div>
  <div class="pair"><div class="to">The atmosphere <b class="k">enables</b> us <b class="k">to stay</b> alive.</div><div class="tr">Atmosfer hayatta kalmamızı sağlar.</div></div>
  <div class="pair"><div class="to">Greenhouse gases <b class="k">cause</b> the glaciers <b class="k">to melt</b> down.</div><div class="tr">Sera gazları buzulların erimesine neden olur.</div></div>
  <div class="pair"><div class="to">The new law <b class="k">allows</b> workers <b class="k">to work</b> from home.</div></div>
  <div class="pair"><div class="to">The storm <b class="k">forced</b> the pilot <b class="k">to land</b> early.</div></div>
  <div class="pair"><div class="to">Good teachers <b class="k">motivate</b> students <b class="k">to learn</b> more.</div></div>
  <p>Aynı kalıbı kullanan diğer fiiller: <i>encourage, require, permit, persuade, oblige, compel, lead, urge, warn, expect, ask, tell, want</i>.</p>
  <div class="warn"><strong>Tuzak:</strong> <b>make</b> ve <b>let</b> <b>to</b> almaz: <i>Greenhouse gases <b>make</b> the glaciers <b>melt</b>.</i> / <i>They <b>let</b> us <b>leave</b>.</i> (<s>make them to melt</s> ✗). <b>help</b> ikisini de alır: <i>help us (to) learn</i>.</div>

  <h3>8.3 Amaç bildiren "to" (-mek için)</h3>
  <div class="formula">to = in order to = so as to</div>
  <div class="pair"><div class="to"><b class="k">To pass</b> YDS, I come here.</div><div class="tr">YDS'yi geçmek için buraya geliyorum.</div></div>
  <div class="pair"><div class="to">We have to breathe oxygen <b class="k">to survive</b>.</div><div class="tr">Hayatta kalmak için oksijen solumak zorundayız.</div></div>
  <div class="pair"><div class="to">He spoke quietly <b class="k">so as not to</b> wake the baby.</div></div>
  <div class="tip"><strong>Olumsuz hali:</strong> <i>in order not to / so as not to</i>.<br><strong>Yazım:</strong> <i>breath</i> isimdir (nefes), <i>breathe</i> fiildir (nefes almak). "have to" fiil ister → <b>breathe</b>.</div>

  <h3>8.4 be V3 + to V (biliniyor / deniyor / sanılıyor)</h3>
  <div class="formula">be V3 + to V1 / to have V3</div>
  <div class="note"><span class="lbl">✎ Defterimden</span>
  Edilgen bir eylemden (be V3) sonra tekrar bir fiil kullanmak istenirse, o fiil <b>"to"</b> ile kullanılmalıdır.<br>
  <i>Crocodiles <b>are known to eat</b>…</i> · <i>The pilot <b>was forced to land</b>.</i> · <i>We <b>are expected to finish</b> by Friday.</i></div>
  <div class="stepper" data-ex="i1"></div>
  <div class="pair">
    <div class="from">People believe that the pyramids were built over 4,500 years ago.</div>
    <div class="to">The pyramids <b class="k">are believed to have been built</b> over 4,500 years ago.</div>
  </div>
  <div class="pair">
    <div class="from">It is said that he lived in Paris for ten years.</div>
    <div class="to">He <b class="k">is said to have lived</b> in Paris for ten years.</div>
  </div>
  <p>Bu kalıbı kuran fiiller: <i>know, say, believe, think, consider, report, expect, suppose, claim, estimate</i>.</p>
  <div class="tip"><strong>Püf:</strong> "that" cümlesindeki eylem ana fiille aynı zamandaysa → <b>to V1</b>; daha önce olmuşsa → <b>to have V3</b>. Yine aynı "önce mi oldu?" sorusu.</div>

  <h3>Alıştırma</h3>
  <div class="pset" data-set="inf"></div>
</section>

<section id="hata">
  <h2><span class="n">9</span>En sık yapılan 8 hata</h2>
  <div class="mist">
    <div class="m"><div class="bad">The first man calling me yesterday was Jack.</div><div class="good">The first man to call me yesterday was Jack.</div><div class="ex">"the first" → to V. V-ing kullanılmaz.</div></div>
    <div class="m"><div class="bad">The car stealing last year was found.</div><div class="good">The car stolen last year was found.</div><div class="ex">Araba çalmaz, çalınır → passive → V3.</div></div>
    <div class="m"><div class="bad">The man was shot yesterday worked for me.</div><div class="good">The man shot yesterday worked for me.</div><div class="ex">who'yu silip "was"ı bırakırsan cümlede iki çekimli fiil olur. who ile be birlikte silinir.</div></div>
    <div class="m"><div class="bad">The book buying by me is expensive.</div><div class="good">The book (which) I bought is expensive.</div><div class="ex">Bağlaçtan sonra özne (I) varsa bu kısaltma yapılmaz; sadece which atılabilir.</div></div>
    <div class="m"><div class="bad">Built in 1900, tourists visit the hotel.</div><div class="good">Built in 1900, the hotel is visited by many tourists.</div><div class="ex">Ne inşa edildi? Otel. Virgülden sonra otel gelmeli.</div></div>
    <div class="m"><div class="bad">Greenhouse gases make the glaciers to melt.</div><div class="good">Greenhouse gases make the glaciers melt. / cause the glaciers to melt.</div><div class="ex">make/let → V1; cause/enable/force → to V1.</div></div>
    <div class="m"><div class="bad">Crocodiles are known eating human flesh.</div><div class="good">Crocodiles are known to eat human flesh.</div><div class="ex">be V3'ten sonra gelen fiil "to" alır.</div></div>
    <div class="m"><div class="bad">Jack, graduating last year, is looking for a job.</div><div class="good">Jack, having graduated last year, is looking for a job.</div><div class="ex">Mezuniyet geçen yıl bitti, iş arama şimdi → zaman farkı → having V3.</div></div>
  </div>
</section>

<section id="ozet">
  <h2><span class="n">10</span>Tek sayfalık özet kart</h2>
  <p class="sub">Sınavdan önce sadece bu bölüme bakman yeterli.</p>
  <div class="cheat">
    <div class="cc"><h4>Ön şart</h4><div class="fm">who/which + fiil / be</div><div class="ex">Bağlaçtan sonra özne varsa kısaltma yok.</div></div>
    <div class="cc"><h4>Active – aynı zaman</h4><div class="fm">V-ing</div><div class="ex">The person living upstairs…</div></div>
    <div class="cc"><h4>Active – önce</h4><div class="fm">having V3</div><div class="ex">Jack, having graduated last year, …</div></div>
    <div class="cc"><h4>Passive</h4><div class="fm">V3 / being V3</div><div class="ex">The car stolen last year… / The bridge being built…</div></div>
    <div class="cc"><h4>Passive – önce</h4><div class="fm">having been V3</div><div class="ex">Having been founded by Bill Gates, …</div></div>
    <div class="cc"><h4>the first / only / -est</h4><div class="fm">to V · to have V3<br>to be V3 · to have been V3</div><div class="ex">The first man to call me…</div></div>
    <div class="cc"><h4>It is + sıfat</h4><div class="fm">to V1 / to be V3</div><div class="ex">It is important to pass YDS.</div></div>
    <div class="cc"><h4>Fiil + nesne</h4><div class="fm">enable/cause/force + O + to V</div><div class="ex">make / let + O + V1 (to yok!)</div></div>
    <div class="cc"><h4>Amaç</h4><div class="fm">to = in order to = so as to</div><div class="ex">We breathe oxygen to survive.</div></div>
    <div class="cc"><h4>be V3 + to</h4><div class="fm">be known/said + to V / to have V3</div><div class="ex">Crocodiles are known to eat human flesh.</div></div>
    <div class="cc"><h4>Cümle başı</h4><div class="fm">Kim? / Ne?</div><div class="ex">Virgülden sonraki özne eylemi yapan/maruz kalan olmalı.</div></div>
    <div class="cc"><h4>Altın soru</h4><div class="fm">Önce mi oldu?</div><div class="ex">Evet → having / to have eklenir.</div></div>
  </div>
</section>

const tests=[],groups=[],items=[];
(function parse(){
  let cur=null;
  RAW.split('\n').forEach(line=>{
    line=line.trim(); if(!line) return;
    if(line[0]==='#'){
      const [t,n]=line.slice(1).split(' ');
      cur={id:t+n,type:t,n:+n,groups:[],
        name:t==='adj'?`Adjective Test ${n}`:`Verb Test ${String(n).padStart(2,'0')}`,
        short:(t==='adj'?'ADJ ':'VERB ')+n};
      tests.push(cur); return;
    }
    const [tr,ws]=line.split('|');
    const g={id:cur.id+'-'+cur.groups.length,test:cur,tr,letter:String.fromCharCode(65+cur.groups.length),items:[]};
    ws.split(';').forEach(raw=>{
      const m=raw.match(/^([^{]*)(?:\{(.*)\})?$/);
      let w=m[1].trim(); const note=m[2]||'';
      const star=w.includes('*'); w=w.replace(/\*/g,'').replace(/\s+/g,' ').trim();
      const it={w,star,note,g,key:g.id+'|'+w,m:(TRM[cur.type]&&TRM[cur.type][w])||''};
      g.items.push(it); items.push(it);
    });
    cur.groups.push(g); groups.push(g);
  });
})();
const norm=s=>s.toLocaleLowerCase('tr').replace(/\*/g,'').replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim();
const byKey=new Map();
items.forEach(it=>{it.k=norm(it.w);if(!byKey.has(it.k))byKey.set(it.k,new Set());byKey.get(it.k).add(it.g)});
groups.forEach(g=>{g.tok=new Set(g.tr.toLocaleLowerCase('tr').split(/[^a-zçğıöşüâî]+/).filter(x=>x.length>3))});
const relCache=new Map();
function related(a,b){
  if(a===b) return true;
  const ck=a.id<b.id?a.id+b.id:b.id+a.id;
  if(relCache.has(ck)) return relCache.get(ck);
  let r=false;
  for(const t of a.tok) if(b.tok.has(t)){r=true;break}
  if(!r) r=a.items.some(i=>byKey.get(i.k).has(b));
  relCache.set(ck,r); return r;
}
function wordRelatedToGroup(it,g){for(const og of byKey.get(it.k)) if(related(og,g)) return true; return false}

const CARDMAX=2;

function rec(it,ok,soft,card){

  if(ok){p.c++;if(card){if(p.s<CARDMAX)p.s++}else{p.t=(p.t||0)+1;p.s=Math.min(MAXS,p.s+1)}}
  else{p.w++;p.s=Math.max(0,p.s-(soft?1:2))}
}

let lastPicked=null;
function wpick(arr){
  if(!arr.length) return null;
  for(let tries=0;tries<4;tries++){
    let tot=0;const ws=arr.map(i=>{const p=P[i.key];const s=p?p.s:0;const w=(MAXS+1-s)+(p&&p.w>p.c?3:0);tot+=w;return w});
    let r=Math.random()*tot,res=arr[arr.length-1];
    for(let j=0;j<arr.length;j++){r-=ws[j];if(r<=0){res=arr[j];break}}
    if(res!==lastPicked||arr.length<2){lastPicked=res;return res}
  }
  return lastPicked=pick(arr);
}

}

let F=null;
function viewFlash(){if(!F||F.sig!==sigOf()+S.dir) newDeck();drawFlash()}
function newDeck(list){

const fkey=c=>c.items?'grp|'+c.id:c.key;
function fstat(c,create){const k=fkey(c);if(!P[k]&&create)P[k]={c:0,w:0,s:0};return P[k]||{}}
function fcountHTML(c){
  const st=fstat(c),k=st.fk||0,u=st.fu||0;

}
function drawFlash(){
  const head=`<div class="meta fhead" style="flex-wrap:nowrap"><div class="seg" style="margin:0;grid-template-columns:1fr 1fr;width:290px">
      <button class="${S.dir==='en'?'on':''}" onclick="S.dir='en';saveS();viewFlash()"><b>EN → TR</b></button>
      <button class="${S.dir==='tr'?'on':''}" onclick="S.dir='tr';saveS();viewFlash()"><b>TR → EN</b></button></div>

  if(!F.deck.length){$('#view').innerHTML=`<div class="stage">${head}${emptyState()}</div>`;return}
  if(F.i>=F.deck.length){
    const graded=F.know+F.again, pct=Math.round(F.know/Math.max(1,graded)*100);
    const seen=[...F.seen];
    const hard=seen.filter(c=>(fstat(c).fu||0)>0).sort((a,b)=>(fstat(b).fu-(fstat(b).fk||0))-(fstat(a).fu-(fstat(a).fk||0))).slice(0,10);
    const label=c=>c.items?esc(c.tr):`<b>${esc(c.w)}</b> <span style="color:var(--mute)">· ${esc(c.g.tr)}</span>`;
    $('#view').innerHTML=`<div class="stage">${head}<div class="panel sum"><div class="ring" style="--v:${pct}"><div>${pct}%</div></div>
      <h2>Deste bitti!</h2><p>${F.uniq} kart</p>
      <div class="fsum"><div class="k"><b>${F.know}</b><span>I know</span></div><div class="u"><b>${F.again}</b><span>I don't know</span></div></div>
      <div class="row"><button class="big primary" onclick="newDeck();drawFlash()">Yeni deste</button>
      ${F.unk.size?`<button class="big again" onclick="newDeck(shuffle([...F.unk]));drawFlash()">Bilmediklerimi tekrar et (${F.unk.size})</button>`:''}</div>
      ${hard.length?`<div class="missed"><div class="qsub" style="text-align:left">En çok zorlandıkların (tüm zamanlar)</div>${hard.map(c=>{const st=fstat(c);
        return `<div class="hrow"><span>${label(c)}</span><span class="cnt"><i class="k">✓ ${st.fk||0}</i><i class="u">✗ ${st.fu||0}</i></span></div>`}).join('')}</div>`:''}
    </div></div>`;
    return;
  }
  const c=F.deck[F.i];
  const done=F.i, total=F.deck.length;
  let front,back;
  if(S.dir==='en'){
    front=`<div class="ftag">${c.g.test.short} · ${c.g.letter}</div>${fcountHTML(c)}<div class="bigword">${esc(c.w)}${c.star?'<sup style="color:var(--warn);font-size:.4em">*</sup>':''}</div>
      <button class="speak" onclick="event.stopPropagation();speak('${esc(c.w).replace(/'/g,"\\'")}')">🔊</button><div class="fhint">Çevirmek için dokun<kbd>Space</kbd></div>`;
    back=`<div class="ftag">ANLAM</div>${fcountHTML(c)}
      <div class="bword">${esc(c.w)}</div>
      ${c.m?`<div class="bigtr bm">${esc(c.m)}</div><div class="bgrp"><span class="gl sm">${c.g.letter}</span>${esc(c.g.tr)}</div>`:`<div class="bigtr">${esc(c.g.tr)}</div>`}
      <div class="syns">${c.g.items.filter(x=>x!==c).map(x=>`<span>${esc(x.w)}</span>`).join('')}</div>
      ${c.note?`<div class="note" style="margin-top:14px">📝 ${esc(c.note)}</div>`:''}`;
  }else{
    front=`<div class="ftag">${c.test.short} · ${c.letter}</div>${fcountHTML(c)}<div class="bigtr" style="font-size:clamp(22px,4.4vw,34px)">${esc(c.tr)}</div>
      <div class="qsub">Bu anlamdaki ${c.items.length} kelimeden kaçını hatırlıyorsun?</div><div class="fhint">Çevirmek için dokun<kbd>Space</kbd></div>`;
    back=`<div class="ftag">KELİMELER</div>${fcountHTML(c)}<div class="bigtr" style="font-size:16px;opacity:.8">${esc(c.tr)}</div>
      <div class="syns list">${c.items.map(x=>`<span><b>${esc(x.w)}</b>${x.m?`<i>${esc(x.m)}</i>`:''}</span>`).join('')}</div>`;
  }
  $('#view').innerHTML=`<div class="stage">${head}
    <div class="meta"><span>Kart <b>${done+1}</b> / ${total}</span><span class="fsess"><i class="k">✓ ${F.know}</i><i class="u">✗ ${F.again}</i></span></div>
    <div class="bar"><i style="width:${done/total*100}%"></i></div>
    <div class="flash ${F.flip?'flipped':''}" id="fc" onclick="if(!this._sw)flip()"><div class="stamp ok">I KNOW</div><div class="stamp no">I DON'T KNOW</div><div class="fin"><div class="face front">${front}</div><div class="face back">${back}</div></div></div>
    <div class="swipehint">Dokun: çevir · Sola kaydır ✗ · Sağa kaydır ✓</div>
    <div class="fbtns">
      <button class="big again" onclick="grade(false)">✗ I don't know<kbd>←</kbd></button>
      <button class="big know" onclick="grade(true)">✓ I know<kbd>→</kbd></button>
    </div></div>`;

}
function flip(){F.flip=!F.flip;$('#fc').classList.toggle('flipped',F.flip)}
function grade(ok){
  const c=F.deck[F.i]; const its=S.dir==='en'?[c]:c.items;
  its.forEach(it=>rec(it,ok,true,true));
  const st=fstat(c,true); if(ok) st.fk=(st.fk||0)+1; else st.fu=(st.fu||0)+1;
  tally(ok); F.seen.add(c);
  if(ok){F.know++;F.unk.delete(c)}
  else{F.again++;F.unk.add(c);F.deck.splice(Math.min(F.deck.length,F.i+3+(Math.random()*3|0)),0,c)}
  F.i++;F.flip=false;drawFlash();
}
function bindSwipe(){
  const el=$('#fc');if(!el)return;
  const ok=el.querySelector('.stamp.ok'),no=el.querySelector('.stamp.no');
  let x0=0,y0=0,dx=0,t0=0,active=false,horiz=null;
  const paint=()=>{
    el.style.transform=`translateX(${dx}px) rotate(${dx/24}deg)`;
    const p=Math.min(1,Math.abs(dx)/90);
    ok.style.opacity=dx>0?p:0;no.style.opacity=dx<0?p:0;
    el.classList.toggle('sw-ok',dx>60);el.classList.toggle('sw-no',dx<-60);
  };
  const reset=()=>{el.style.transition='';el.style.transform='';ok.style.opacity=0;no.style.opacity=0;el.classList.remove('sw-ok','sw-no');setTimeout(()=>{el._sw=false},60)};
  const start=(x,y)=>{active=true;horiz=null;x0=x;y0=y;dx=0;t0=Date.now();el._sw=false;el.style.transition='none'};
  const move=(x,y,e)=>{
    if(!active)return;
    dx=x-x0;const dy=y-y0;
    if(horiz===null&&(Math.abs(dx)>6||Math.abs(dy)>6))horiz=Math.abs(dx)>Math.abs(dy);
    if(!horiz)return;
    if(e&&e.cancelable)e.preventDefault();
    el._sw=true;paint();
  };
  const end=()=>{
    if(!active)return;active=false;
    if(!horiz){reset();return}
    const v=Math.abs(dx)/Math.max(1,Date.now()-t0);
    if(Math.abs(dx)>80||(Math.abs(dx)>35&&v>.45)){
      const d=dx>0?1:-1;el.style.transition='transform .2s ease-out';
      el.style.transform=`translateX(${d*window.innerWidth*1.1}px) rotate(${d*16}deg)`;
      try{navigator.vibrate&&navigator.vibrate(10)}catch(_){}
      setTimeout(()=>grade(d>0),190);
    }else reset();
  };
  el.addEventListener('touchstart',e=>{if(e.touches.length===1)start(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
  el.addEventListener('touchmove',e=>{if(e.touches.length===1)move(e.touches[0].clientX,e.touches[0].clientY,e)},{passive:false});
  el.addEventListener('touchend',end);
  el.addEventListener('touchcancel',()=>{active=false;reset()});
  el.addEventListener('mousedown',e=>{start(e.clientX,e.clientY);
    const mm=ev=>move(ev.clientX,ev.clientY,ev),mu=()=>{end();window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu)};
    window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu)});
}

let Q=null;const QN=15;
const QTITLE={meaning:'Anlam Testi',syn:'Eş Anlam Testi',odd:'Farklı Olanı Bul'};
function viewQuiz(kind){if(!Q||Q.sig!==sigOf()+kind) newQuiz(kind);drawQuiz()}
function newQuiz(kind,pool){Q={kind,sig:sigOf()+kind,i:0,score:0,missed:[],ans:null,pool:pool||null};Q.cur=gen()}
function gen(){for(let t=0;t<40;t++){const q=({meaning:genMeaning,syn:genSyn,odd:genOdd})[Q.kind]();if(q)return q}return null}
function poolNow(){const {its}=scope();return (Q.pool&&Q.pool.length)?Q.pool:its}
function groupMini(g,hl){
  return `<div class="mini-g"><div class="mg-h"><span class="gl sm">${g.letter}</span>${esc(g.tr)}<em>${g.test.short}</em></div>
  <div class="mg-w">${g.items.map(x=>{const on=hl&&hl.includes(x.w);return `<span class="${on?'hl':''}">${esc(x.w)}${on&&x.m?`<i>${esc(x.m)}</i>`:''}</span>`}).join('')}</div></div>`;
}
function genMeaning(){
  const it=wpick(poolNow()); if(!it) return null;
  const own=byKey.get(it.k);
  const c=distractorGroups(it.g,g=>!own.has(g)&&![...own].some(o=>related(o,g)));
  const trs=new Set([it.g.tr]); const ds=[];
  for(const g of shuffle(c.slice())){if(!trs.has(g.tr)){trs.add(g.tr);ds.push(g)} if(ds.length===3)break}
  if(ds.length<3) return null;
  return {it,
    prompt:`<div class="bigword">${esc(it.w)}</div><button class="speak" onclick="speak(this.dataset.w)" data-w="${esc(it.w)}">🔊</button>`,
    sub:'Bu kelime hangi anlam grubunda yer alıyor?',
    opts:shuffle([{label:it.g.tr,ok:true},...ds.map(g=>({label:g.tr,ok:false,g}))]),
    explain:()=>groupMini(it.g,[it.w])+(own.size>1?`<div class="qsub" style="text-align:left">Bu kelime başka gruplarda da geçiyor:</div>`+[...own].filter(g=>g!==it.g).map(g=>groupMini(g,[it.w])).join(''):''),
    rec:(ok,o)=>{rec(it,ok)}};
}
function genSyn(){
  const it=wpick(poolNow().filter(i=>i.g.items.length>=2)); if(!it) return null;
  const own=byKey.get(it.k);
  const ans=pick(it.g.items.filter(x=>x.k!==it.k)); if(!ans) return null;
  const cg=distractorGroups(it.g,g=>!own.has(g)&&![...own].some(o=>related(o,g)));
  const ws=dedupeK(shuffle(cg.flatMap(g=>g.items))).filter(c=>c.k!==ans.k&&![...own].some(g=>wordRelatedToGroup(c,g))).slice(0,4);
  if(ws.length<4) return null;
  return {it,
    prompt:`<div class="qline">“<b>${esc(it.w)}</b>” means ----.</div>`,
    sub:'Anlamca en yakın kelimeyi seç',
    opts:shuffle([{label:ans.w,ok:true,it:ans},...ws.map(w=>({label:w.w,ok:false,it:w}))]),
    explain:(o)=>groupMini(it.g,[it.w,ans.w])+(o&&!o.ok?groupMini(o.it.g,[o.it.w]):''),
    rec:(ok)=>{rec(it,ok);rec(ans,ok,true)}};
}
function genOdd(){
  const it=wpick(poolNow().filter(i=>dedupeK(i.g.items).length>=3)); if(!it) return null;
  const g=it.g;
  const three=[it,...sample(dedupeK(g.items).filter(x=>x.k!==it.k),2)];
  const cg=distractorGroups(g,x=>!related(x,g)); if(!cg.length) return null;
  const og=pick(cg);
  const odd=pick(og.items.filter(x=>!wordRelatedToGroup(x,g)&&!three.some(t=>byKey.get(t.k).has(og))));
  if(!odd) return null;
  return {it,
    prompt:`<div class="qline" style="font-size:clamp(20px,4vw,28px)">Hangisi diğerleriyle <b>aynı anlam grubunda değil</b>?</div>`,
    sub:'Üç kelime eş anlamlı, biri farklı',
    opts:shuffle([...three.map(x=>({label:x.w,ok:false,it:x})),{label:odd.w,ok:true,it:odd}]),
    explain:()=>groupMini(g,three.map(x=>x.w))+groupMini(og,[odd.w]),
    rec:(ok)=>{three.forEach(x=>rec(x,ok,true));rec(odd,ok,true)}};
}
function drawQuiz(){
  const k=Q.kind;
  if(!Q.cur){$('#view').innerHTML=`<div class="stage">${emptyState()}</div>`;return}
  if(Q.i>=QN){
    const pct=Math.round(Q.score/QN*100);
    const miss=dedupeK(Q.missed);
    const msg=pct>=90?'Mükemmel! 🏆':pct>=70?'Çok iyi gidiyor! 💪':pct>=50?'Fena değil, devam!':'Tekrar zamanı 📚';
    $('#view').innerHTML=`<div class="stage"><div class="panel sum"><div class="ring" style="--v:${pct}"><div>${Q.score}/${QN}</div></div>
      <h2>${msg}</h2><p>${QTITLE[k]} tamamlandı · %${pct} başarı</p>
      <div class="row"><button class="big primary" onclick="newQuiz('${k}');drawQuiz()">Yeni tur</button>
      ${miss.length?`<button class="big again" onclick="newQuiz('${k}',Q.missed.slice());drawQuiz()">Yanlışları tekrar et (${miss.length})</button>`:''}</div>

    </div></div>`;
    return;
  }
  const q=Q.cur,a=Q.ans;
  const opts=q.opts.map((o,i)=>{
    let cls='';if(a!=null){if(o.ok)cls='good';else if(i===a)cls='badc';else cls='dim'}
    return `<button class="opt ${cls}" ${a!=null?'disabled':''} onclick="answer(${i})"><span class="k">${'ABCDE'[i]}</span>${esc(o.label)}</button>`}).join('');
  let ex='';

  $('#view').innerHTML=`<div class="stage">

    <div class="opts">${opts}</div>${ex}</div>`;
}
function answer(i){

let B=null;const BN=10;
function viewBuild(){if(!B||B.sig!==sigOf()) newBuild();drawBuild()}
function newBuild(){B={sig:sigOf(),i:0,score:0};B.cur=genBuild()}
function genBuild(){
  const {its}=scope();
  for(let t=0;t<30;t++){
    const it=wpick(its.filter(i=>dedupeK(i.g.items).length>=3)); if(!it) return null;
    const g=it.g; const uniq=dedupeK(g.items);
    const right=sample(uniq,Math.min(6,uniq.length));
    const cg=distractorGroups(g,x=>!related(x,g));
    const wrong=dedupeK(shuffle(cg.flatMap(x=>x.items))).filter(c=>!wordRelatedToGroup(c,g)&&!right.some(r=>r.k===c.k)).slice(0,10-right.length);
    if(wrong.length<3) continue;
    return {g,chips:shuffle([...right.map(x=>({it:x,ok:true})),...wrong.map(x=>({it:x,ok:false}))]),picked:new Set(),checked:false};
  }
  return null;
}
function drawBuild(){
  if(!B.cur){$('#view').innerHTML=`<div class="stage">${emptyState()}</div>`;return}
  if(B.i>=BN){
    const pct=Math.round(B.score/BN*100);
    $('#view').innerHTML=`<div class="stage"><div class="panel sum"><div class="ring" style="--v:${pct}"><div>${B.score}/${BN}</div></div>
      <h2>${pct>=80?'Gruplar senden sorulur! 🧱':'İyi antrenman!'}</h2><p>${BN} grubun ${B.score} tanesini eksiksiz kurdun</p>
      <div class="row"><button class="big primary" onclick="newBuild();drawBuild()">Yeni tur</button></div></div></div>`;return;
  }
  const c=B.cur,nRight=c.chips.filter(x=>x.ok).length;
  const chips=c.chips.map((x,i)=>{
    let cls=c.picked.has(i)?'sel':'';
    if(c.checked){cls=x.ok?(c.picked.has(i)?'good':'miss'):(c.picked.has(i)?'bad':'dim')}
    return `<button class="bchip ${cls}" ${c.checked?'disabled':''} onclick="pickB(${i})">${esc(x.it.w)}</button>`}).join('');
  let foot;
  if(!c.checked) foot=`<button class="big primary stickybtn" onclick="checkB()">Kontrol et<kbd>Enter</kbd></button>`;
  else{
    const hits=c.chips.filter((x,i)=>x.ok&&c.picked.has(i)).length,bad=c.chips.filter((x,i)=>!x.ok&&c.picked.has(i)).length;
    const perfect=hits===nRight&&!bad;
    const wrongs=c.chips.filter((x,i)=>!x.ok&&c.picked.has(i));
    foot=`<div class="explain"><div class="verdict ${perfect?'ok':'no'}">${perfect?'✓ Kusursuz!':`${hits}/${nRight} doğru seçim${bad?` · ${bad} yanlış seçim`:''}`}</div>
      ${wrongs.length?`<div class="wrongs"><div class="wh">Yanlış seçtiklerinin anlamı</div>${wrongs.map(x=>`<div class="wi"><b>${esc(x.it.w)}${x.it.m?`<i>${esc(x.it.m)}</i>`:''}</b><span>${[...byKey.get(x.it.k)].map(g=>esc(g.tr)+` <em>${g.test.short}</em>`).join('<br>')}</span></div>`).join('')}</div>`:''}
      <button class="big primary" id="nextBtn" onclick="nextB()">${B.i+1>=BN?'Sonuçları gör':'Sonraki grup'} →<kbd>Enter</kbd></button>${groupMini(c.g,c.chips.filter(x=>x.ok).map(x=>x.it.w))}</div>`;
  }
  $('#view').innerHTML=`<div class="stage">
    <div class="meta"><span>Grup Kur · <b>${B.i+1}</b> / ${BN}</span><span>Puan <b>${B.score}</b></span></div>
    <div class="bar"><i style="width:${(B.i+(c.checked?1:0))/BN*100}%"></i></div>
    <div class="qcard"><div class="ftag">${c.g.test.short}</div><div class="qsub" style="margin:0 0 8px">Bu anlama gelen <b style="color:var(--text)">${nRight}</b> kelimeyi seç</div>
      <div class="bigtr" style="font-size:clamp(20px,4vw,30px)">${esc(c.g.tr)}</div></div>
    <div class="bchips">${chips}</div>${foot}</div>`;
}
function pickB(i){const c=B.cur;c.picked.has(i)?c.picked.delete(i):c.picked.add(i);drawBuild()}
function checkB(){
  const c=B.cur;if(c.checked)return;c.checked=true;
  let perfect=true;
  c.chips.forEach((x,i)=>{const p=c.picked.has(i);if(x.ok){rec(x.it,p,true);if(!p)perfect=false}else if(p){perfect=false}});
  if(perfect)B.score++;tally(perfect);drawBuild();
  const nb=$('#nextBtn');if(nb&&isMobile())nb.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function nextB(){B.i++;if(B.i<BN)B.cur=genBuild();drawBuild();drawScope();toView()}

  {c:"The first / only",q:"The first woman ____ the Nobel Prize was Marie Curie.",o:["winning","to win","won","having won"],a:1,e:"\"The first\" → to V1.",g:"first"},
  {c:"Active",q:"____ Microsoft, Bill Gates is one of the richest people in the world.",o:["Founded","Having been founded","Having founded","To be founded"],a:2,e:"Bill Gates kurdu (active) ve önce oldu → Having founded.",g:"active"},
  {c:"Passive",q:"The bridge ____ now will connect the two cities.",o:["building","being built","having built","to build"],a:1,e:"Köprü yapılıyor (passive) ve şu an devam ediyor → being built.",g:"passive"},
  {c:"Infinitive",q:"Greenhouse gases cause the glaciers ____ .",o:["melt","melting","to melt","melted"],a:2,e:"cause + nesne + to V1.",g:"inf"},
  {c:"Infinitive",q:"Crocodiles are known ____ human flesh.",o:["eat","to eat","eating","to be eaten"],a:1,e:"be V3 + to V1 (timsahlar yer → active).",g:"inf"},
  {c:"Passive",q:"The car ____ before 2000 was found yesterday.",o:["having stolen","stealing","having been stolen","to steal"],a:2,e:"Araba çalındı (passive) ve bu önce oldu → having been stolen.",g:"passive"},
  {c:"Infinitive",q:"The pyramids are believed ____ over 4,500 years ago.",o:["to build","to be built","to have been built","having built"],a:2,e:"Passive + önceden olmuş → to have been built.",g:"inf"},
  {c:"Infinitive",q:"We have to breathe oxygen ____ .",o:["surviving","to survive","survived","for survive"],a:1,e:"Amaç (-mek için) → to survive.",g:"inf"},
  {c:"Infinitive",q:"The heavy rain made the river ____ .",o:["to overflow","overflowing","overflow","overflowed"],a:2,e:"make + nesne + V1 (to almaz!).",g:"inf"},
  {c:"The first / only",q:"She is the youngest player ____ for the national team.",o:["selecting","to have been selected","having selected","to select"],a:1,e:"Superlative + passive + önceden → to have been selected.",g:"first"},
  {c:"Active",q:"The man ____ by the door is talking on the phone.",o:["stood","standing","to be stood","having been stood"],a:1,e:"Adam duruyor (active), aynı zaman → standing.",g:"active"},
  {c:"Passive",q:"The computer ____ last year was broken last week.",o:["buying","bought","to buy","having bought"],a:1,e:"Bilgisayar satın alındı → passive → bought.",g:"passive"},
  {c:"The first / only",q:"The last man ____ me last week was John.",o:["calling","called","to call","to be called"],a:2,e:"the last + active → to call.",g:"first"},
  {c:"The first / only",q:"The most expensive car ____ last year was found yesterday.",o:["stealing","to steal","to be stolen","having stolen"],a:2,e:"the most + passive → to be stolen.",g:"first"},
  {c:"Active",q:"Jack, ____ from university last year, is hunting for a new job.",o:["graduated","having graduated","to graduate","being graduated"],a:1,e:"Geçen yıl mezun oldu, şimdi iş arıyor → having graduated.",g:"active"},
  {c:"Kim / Ne?",q:"Written in 1850, ________.",o:["the author became famous with this novel","the novel is still read by millions","readers still love it","it is a classic"],a:1,e:"Ne yazıldı? Roman → the novel.",g:"basta"},
  {c:"Kim / Ne?",q:"Having finished her homework, ________.",o:["the TV was turned on","Ayşe watched TV","her mother was happy","it was time for dinner"],a:1,e:"Kim ödevini bitirdi? Ayşe.",g:"basta"},
  {c:"Infinitive",q:"It is important ____ YDS.",o:["passing","to pass","passed","pass"],a:1,e:"It is + sıfat + to V1.",g:"inf"},
  {c:"Infinitive",q:"The atmosphere enables us ____ alive.",o:["stay","staying","to stay","stayed"],a:2,e:"enable + nesne + to V1.",g:"inf"},
  {c:"Passive",q:"Most of the products ____ in this factory are exported.",o:["producing","produced","to produce","having produced"],a:1,e:"Ürünler üretiliyor (passive) → produced.",g:"passive"}
 ]
};
const CAT={active:["Active kısaltma","#active"],passive:["Passive kısaltma","#passive"],first:["The first / only + to V","#first"],inf:["Infinitive kullanımları","#inf"],basta:["Cümle başı & Kim/Ne","#basta"]};
let fRight=0,fDone=0;const fStats={};
function buildSet(box){
 const set=box.dataset.set,final=set==='final';box.innerHTML='';
 Q[set].forEach((it,i)=>{
  const d=document.createElement('div');d.className='q';
  d.innerHTML=`${it.c?`<span class="cat">${it.c}</span>`:''}<p>${i+1}. ${it.q}</p><div class="opts${it.o.some(x=>x.length>30)?' col':''}"></div><div class="exp">${it.e}</div>`;
  const opts=d.querySelector('.opts'),exp=d.querySelector('.exp');let done=false;
  it.o.forEach((t,j)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(97+j)+') '+t;
   b.onclick=()=>{if(done)return;done=true;const ok=j===it.a;
    if(ok)b.classList.add('right');else{b.classList.add('wrong');opts.children[it.a].classList.add('right');}
    exp.innerHTML=(ok?'✓ ':'✗ ')+it.e;exp.classList.add('show');
    if(final){fDone++;if(ok)fRight++;const s=fStats[it.g]||(fStats[it.g]={r:0,t:0});s.t++;if(ok)s.r++;
     root.getElementById('fscore').textContent=fRight+' / '+fDone;if(fDone===Q.final.length)showFinal();}};
   opts.appendChild(b);});
  box.appendChild(d);
 });
}
function showFinal(){
 const el=root.getElementById('final-result');const pct=Math.round(fRight/Q.final.length*100);
 let h=`<h3 style="margin-top:0">Sonuç: ${fRight} / ${Q.final.length} (%${pct})</h3>`;
 h+=pct>=85?'<p>Harika! Konuya hakimsin. Özet kartı sınav öncesi tekrar için kullan.</p>':pct>=60?'<p>İyi gidiyorsun. Aşağıda düşük kalan konuların bölümlerine dön.</p>':'<p>Temeli tekrar etmekte fayda var. Önce <a href="#temel">Ön bilgi</a> ve <a href="#karar">Karar sihirbazı</a> bölümlerine dön.</p>';
 Object.keys(fStats).forEach(k=>{const s=fStats[k],p=Math.round(s.r/s.t*100);
  h+=`<div style="display:flex;justify-content:space-between;font-size:14px"><span>${CAT[k][0]}</span><span>${s.r}/${s.t}${p<70?` · <a href="${CAT[k][1]}">bölüme dön</a>`:''}</span></div><div class="bar"><i style="width:${p}%;background:${p<70?'var(--red)':'var(--green)'}"></i></div>`;});
 el.innerHTML=h;el.style.display='block';el.scrollIntoView({behavior:'smooth',block:'center'});
}
root.querySelectorAll('.qset').forEach(buildSet);
root.getElementById('reset').onclick=()=>{fRight=0;fDone=0;for(const k in fStats)delete fStats[k];
 root.getElementById('fscore').textContent='0 / 0';root.getElementById('final-result').style.display='none';
 buildSet(root.querySelector('.qset[data-set="final"]'));};

(function(){
 const pg=root.getElementById('progress'),top=root.getElementById('top');
 const links=[...root.querySelectorAll('nav a')],secs=links.map(a=>root.querySelector(a.getAttribute('href')));
 function onS(){const h=document.documentElement,max=h.scrollHeight-h.clientHeight;pg.style.width=(max>0?h.scrollTop/max*100:0)+'%';
  top.classList.toggle('show',h.scrollTop>600);
  let cur=-1;secs.forEach((s,i)=>{if(s&&s.getBoundingClientRect().top<120)cur=i;});
  links.forEach((a,i)=>a.classList.toggle('on',i===cur));
  if(cur>=0){const a=links[cur],n=a.parentElement;const l=a.offsetLeft-n.clientWidth/2+a.clientWidth/2;if(Math.abs(n.scrollLeft-l)>40)n.scrollTo({left:l,behavior:'smooth'});}}
 addEventListener('scroll',onS,{passive:true});onS();
 top.onclick=()=>scrollTo({top:0,behavior:'smooth'});
 const els=root.querySelectorAll('section, .pair, .stepper, .q, .pr, .cc, .m');
 if('IntersectionObserver' in window){els.forEach(e=>e.classList.add('rv'));
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{rootMargin:'0px 0px -40px 0px'});
  els.forEach(e=>io.observe(e));}
})();

root.addEventListener('click',e=>{
  const a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;
  const id=a.getAttribute('href').slice(1);const t=root.getElementById(id);
  e.preventDefault();
  if(t)t.scrollIntoView({behavior:'smooth'});else go(id);
});
}

route();
</script>
