<title>Memoria Verbi</title>
<meta name="apple-mobile-web-app-title" content="Memoria Verbi">
<meta name="application-name" content="Memoria Verbi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0a16;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.07);--line:rgba(255,255,255,.09);
  --text:#eeedf7;--mute:#9b98b6;--a1:#b794ff;--a2:#ff7ab6;--ok:#3ee0a1;--bad:#ff6b81;--warn:#ffc35c;
  --r:18px;--disp:'Fraunces',Georgia,serif;--ui:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;
}
body.verb{--a1:#4fe0c4;--a2:#5aa8ff}
body.mix{--a1:#9d8cff;--a2:#4fe0c4}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--ui);color:var(--text);min-height:100vh;
  background:var(--bg);
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;
}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1100px 620px at 8% -12%, color-mix(in srgb,var(--a1) 26%,transparent),transparent 62%),
    radial-gradient(900px 560px at 105% 0%, color-mix(in srgb,var(--a2) 18%,transparent),transparent 60%),
    radial-gradient(700px 500px at 50% 120%, color-mix(in srgb,var(--a1) 10%,transparent),transparent 70%);
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 80px calc(18px + env(safe-area-inset-left))}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:22px;
  background:linear-gradient(135deg,var(--a1),var(--a2));color:#140f24;box-shadow:0 8px 30px -8px var(--a1)}
.brand h1{font-family:var(--disp);font-weight:700;font-size:26px;margin:0;letter-spacing:-.02em}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 14px;min-width:96px}
.stat b{display:block;font-size:18px;font-weight:800}
.stat span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;backdrop-filter:blur(14px)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:rgba(0,0,0,.25);padding:5px;border-radius:14px;margin-bottom:14px}
.seg button{padding:10px 8px;border-radius:10px;text-align:center;transition:.2s;color:var(--mute)}
.seg button b{display:block;font-weight:800;font-size:15px;color:var(--text)}
.seg button small{font-size:11px}
.seg button.on{background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 38%,transparent),color-mix(in srgb,var(--a2) 26%,transparent));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a1) 60%,transparent)}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.rowlab{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--mute);width:42px}
.tchip{position:relative;width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-weight:800;font-size:14px;color:var(--mute);overflow:hidden;transition:.15s}
.tchip:hover{border-color:color-mix(in srgb,var(--a1) 60%,transparent);color:var(--text)}
.tchip.on{background:color-mix(in srgb,var(--a1) 22%,transparent);border-color:color-mix(in srgb,var(--a1) 70%,transparent);color:var(--text)}
.tchip i{position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p)*100%);background:var(--ok)}
.scopebar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
.scopeact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mini{font-size:12px;font-weight:700;padding:7px 11px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.mini:hover{background:rgba(255,255,255,.1)}
.sw{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;cursor:pointer;user-select:none}
.sw input{display:none}
.sw span{width:34px;height:20px;border-radius:20px;background:rgba(255,255,255,.12);position:relative;transition:.2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--warn)}
.sw input:checked+span::after{left:17px}
.hint{font-size:11px;color:var(--mute);margin-top:4px}
.tabs{display:flex;gap:6px;margin:18px 0;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;color:var(--mute);border:1px solid transparent;transition:.15s;white-space:nowrap}
.tab:hover{color:var(--text);background:var(--panel)}
.tab.on{color:var(--text);background:var(--panel2);border-color:var(--line);box-shadow:0 0 0 1px color-mix(in srgb,var(--a1) 35%,transparent) inset}
.tab em{font-style:normal;margin-right:6px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;position:sticky;top:0;z-index:6;padding:10px 0 8px;padding-top:calc(10px + env(safe-area-inset-top));background:linear-gradient(var(--bg) 78%,transparent)}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;font-size:16px;padding:12px 14px 12px 40px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--text);font:inherit;outline:none}
.search input:focus{border-color:color-mix(in srgb,var(--a1) 70%,transparent)}
.search::before{content:"⌕";position:absolute;left:14px;top:50%;transform:translateY(-52%);color:var(--mute);font-size:20px}
.toggles{display:flex;gap:6px}
.tg{padding:10px 13px;border-radius:12px;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--mute);background:rgba(0,0,0,.2)}
.tg.on{color:#140f24;background:var(--warn);border-color:var(--warn)}
.th{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:700;font-size:21px;margin:26px 0 12px;letter-spacing:-.01em}
.th:first-child{margin-top:4px}
.tbadge{font-family:var(--ui);font-size:10px;font-weight:800;letter-spacing:.12em;padding:4px 7px;border-radius:7px;background:#b794ff33;color:#d5c2ff}
.tbadge.verb{background:#4fe0c433;color:#a6f3e3}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:12px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;transition:.2s;position:relative;overflow:hidden}
.gcard::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--a1),var(--a2));opacity:.65}
.gcard:hover{border-color:rgba(255,255,255,.18);transform:translateY(-2px)}
.gcard header{display:flex;align-items:flex-start;gap:10px;margin-bottom:11px}
.gl{flex:0 0 auto;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#140f24}
.gl.sm{width:22px;height:22px;font-size:11px;border-radius:7px}
.gcard h4{margin:3px 0 0;font-size:13.5px;font-weight:800;letter-spacing:.03em;line-height:1.35;flex:1}
.gc{font-size:11px;color:var(--mute);font-weight:700;margin-top:5px}
.wl{display:flex;flex-wrap:wrap;gap:6px}
.wchip{font-size:13.5px;font-weight:600;padding:6px 10px 6px 20px;border-radius:9px;background:rgba(255,255,255,.055);border:1px solid var(--line);position:relative;transition:.15s;text-align:left}
.wchip::before{content:"";position:absolute;left:8px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:rgba(255,255,255,.22)}
.wchip.m1::before{background:var(--warn)}
.wchip.m2::before{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.wchip:hover{background:rgba(255,255,255,.1)}
.wchip sup{color:var(--warn);margin-left:1px}
.wchip.hit{background:color-mix(in srgb,var(--a1) 30%,transparent);border-color:var(--a1)}
.cover{filter:blur(6px);user-select:none;cursor:pointer}
.cover:hover{filter:blur(4px)}
.note{font-size:12px;color:#ffdba0;margin-top:9px;padding:7px 10px;border-radius:9px;background:rgba(255,195,92,.08);border:1px dashed rgba(255,195,92,.3)}
.note b{color:var(--warn)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:-4px 0 12px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:rgba(255,255,255,.22)}

const tests=[],groups=[],items=[];
(function parse(){
  let cur=null;
  RAW.split('\n').forEach(line=>{
    line=line.trim(); if(!line) return;
    if(line[0]==='#'){
      const [t,n]=line.slice(1).split(' ');
      cur={id:t+n,type:t,n:+n,groups:[],
        name:t==='adj'?`Adjective Test ${n}`:`Verb Test ${String(n).padStart(2,'0')}`,
        short:(t==='adj'?'ADJ ':'VERB ')+n};
      tests.push(cur); return;
    }
    const [tr,ws]=line.split('|');
    const g={id:cur.id+'-'+cur.groups.length,test:cur,tr,letter:String.fromCharCode(65+cur.groups.length),items:[]};
    ws.split(';').forEach(raw=>{
      const m=raw.match(/^([^{]*)(?:\{(.*)\})?$/);
      let w=m[1].trim(); const note=m[2]||'';
      const star=w.includes('*'); w=w.replace(/\*/g,'').replace(/\s+/g,' ').trim();
      const it={w,star,note,g,key:g.id+'|'+w};
      g.items.push(it); items.push(it);
    });
    cur.groups.push(g); groups.push(g);
  });
})();

const relCache=new Map();
function related(a,b){
  if(a===b) return true;
  const ck=a.id<b.id?a.id+b.id:b.id+a.id;
  if(relCache.has(ck)) return relCache.get(ck);
  let r=false;
  for(const t of a.tok) if(b.tok.has(t)){r=true;break}
  if(!r) r=a.items.some(i=>byKey.get(i.k).has(b));
  relCache.set(ck,r); return r;
}
function wordRelatedToGroup(it,g){for(const og of byKey.get(it.k)) if(related(og,g)) return true; return false}

function rec(it,ok,soft){

  if(ok){p.c++;p.s=Math.min(5,p.s+1)}else{p.w++;p.s=Math.max(0,p.s-(soft?1:2))}

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];

const dedupeK=a=>{const s=new Set();return a.filter(x=>s.has(x.k)?false:(s.add(x.k),true))};
let lastPicked=null;
function wpick(arr){
  if(!arr.length) return null;
  for(let tries=0;tries<4;tries++){
    let tot=0;const ws=arr.map(i=>{const p=P[i.key];const s=p?p.s:0;const w=(6-s)+(p&&p.w>p.c?3:0);tot+=w;return w});
    let r=Math.random()*tot,res=arr[arr.length-1];
    for(let j=0;j<arr.length;j++){r-=ws[j];if(r<=0){res=arr[j];break}}
    if(res!==lastPicked||arr.length<2){lastPicked=res;return res}
  }
  return lastPicked=pick(arr);
}
function distractorGroups(base,filt){
  const {gs}=scope();
  let c=gs.filter(g=>g.test.type===base.test.type&&filt(g));
  if(c.length<8) c=groups.filter(g=>g.test.type===base.test.type&&filt(g));
  return c;
}

const fkey=c=>c.items?'grp|'+c.id:c.key;
function fstat(c,create){const k=fkey(c);if(!P[k]&&create)P[k]={c:0,w:0,s:0};return P[k]||{}}
function fcountHTML(c){
  const st=fstat(c),k=st.fk||0,u=st.fu||0;
  if(!k&&!u) return `<div class="fcount new">Yeni kart</div>`;

function drawFlash(){
  const head=`<div class="meta fhead" style="flex-wrap:nowrap"><div class="seg" style="margin:0;grid-template-columns:1fr 1fr;width:290px">
      <button class="${S.dir==='en'?'on':''}" onclick="S.dir='en';saveS();viewFlash()"><b>EN → TR</b></button>

  if(!F.deck.length){$('#view').innerHTML=`<div class="stage">${head}${emptyState()}</div>`;return}
  if(F.i>=F.deck.length){
    const graded=F.know+F.again, pct=Math.round(F.know/Math.max(1,graded)*100);
    const seen=[...F.seen];
    const hard=seen.filter(c=>(fstat(c).fu||0)>0).sort((a,b)=>(fstat(b).fu-(fstat(b).fk||0))-(fstat(a).fu-(fstat(a).fk||0))).slice(0,10);
    const label=c=>c.items?esc(c.tr):`<b>${esc(c.w)}</b> <span style="color:var(--mute)">· ${esc(c.g.tr)}</span>`;
    $('#view').innerHTML=`<div class="stage">${head}<div class="panel sum"><div class="ring" style="--v:${pct}"><div>${pct}%</div></div>
      <h2>Deste bitti!</h2><p>${F.uniq} kart</p>
      <div class="fsum"><div class="k"><b>${F.know}</b><span>Biliyorum</span></div><div class="u"><b>${F.again}</b><span>Bilmiyorum</span></div><div><b>${F.skip}</b><span>Geçildi</span></div></div>
      <div class="row"><button class="big primary" onclick="newDeck();drawFlash()">Yeni deste</button>
      ${F.unk.size?`<button class="big again" onclick="newDeck(shuffle([...F.unk]));drawFlash()">Bilmediklerimi tekrar et (${F.unk.size})</button>`:''}</div>
      ${hard.length?`<div class="missed"><div class="qsub" style="text-align:left">En çok zorlandıkların (tüm zamanlar)</div>${hard.map(c=>{const st=fstat(c);
        return `<div class="hrow"><span>${label(c)}</span><span class="cnt"><i class="k">✓ ${st.fk||0}</i><i class="u">✗ ${st.fu||0}</i></span></div>`}).join('')}</div>`:''}
    </div></div>`;
    return;
  }
  const c=F.deck[F.i];
  const done=F.i, total=F.deck.length;

    front=`<div class="ftag">${c.g.test.short} · ${c.g.letter}</div>${fcountHTML(c)}<div class="bigword">${esc(c.w)}${c.star?'<sup style="color:var(--warn);font-size:.4em">*</sup>':''}</div>
      <button class="speak" onclick="event.stopPropagation();speak('${esc(c.w).replace(/'/g,"\\'")}')">🔊</button><div class="fhint">Çevirmek için dokun<kbd>Space</kbd></div>`;
    back=`<div class="ftag">ANLAM</div>${fcountHTML(c)}<div class="bigtr">${esc(c.g.tr)}</div>

      <div class="qsub">Bu anlamdaki ${c.items.length} kelimeden kaçını hatırlıyorsun?</div><div class="fhint">Çevirmek için dokun<kbd>Space</kbd></div>`;

      <div class="syns">${c.items.map(x=>`<span>${esc(x.w)}</span>`).join('')}</div>`;
  }
  $('#view').innerHTML=`<div class="stage">${head}

    <div class="bar"><i style="width:${done/total*100}%"></i></div>
    <div class="flash ${F.flip?'flipped':''}" id="fc" onclick="if(!this._sw)flip()"><div class="fin"><div class="face front">${front}</div><div class="face back">${back}</div></div></div>

function flip(){F.flip=!F.flip;$('#fc').classList.toggle('flipped',F.flip)}
function grade(ok){
  const c=F.deck[F.i]; const its=S.dir==='en'?[c]:c.items;
  its.forEach(it=>rec(it,ok,true));
  const st=fstat(c,true); if(ok) st.fk=(st.fk||0)+1; else st.fu=(st.fu||0)+1;
  tally(ok); F.seen.add(c);
  if(ok){F.know++;F.unk.delete(c)}
  else{F.again++;F.unk.add(c);F.deck.splice(Math.min(F.deck.length,F.i+3+(Math.random()*3|0)),0,c)}
  F.i++;F.flip=false;drawFlash();
}
function skipCard(){F.skip++;F.i++;F.flip=false;drawFlash()}
function bindSwipe(){
  const el=$('#fc');if(!el)return;
  let x0=0,y0=0,dx=0,down=false,horiz=null;
  el.addEventListener('pointerdown',e=>{down=true;x0=e.clientX;y0=e.clientY;dx=0;horiz=null;el._sw=false;el.style.transition='none'});
  el.addEventListener('pointermove',e=>{
    if(!down)return;dx=e.clientX-x0;const dy=e.clientY-y0;
    if(horiz===null&&(Math.abs(dx)>8||Math.abs(dy)>8)){horiz=Math.abs(dx)>Math.abs(dy);if(horiz){el._sw=true;try{el.setPointerCapture(e.pointerId)}catch(_){}}}
    if(horiz){el.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;el.classList.toggle('sw-ok',dx>70);el.classList.toggle('sw-no',dx<-70)}
  });
  const end=()=>{
    if(!down)return;down=false;el.style.transition='';
    if(horiz&&Math.abs(dx)>90){const d=dx>0?1:-1;el.style.transform=`translateX(${d*120}vw) rotate(${d*18}deg)`;setTimeout(()=>grade(d>0),170)}
    else{el.style.transform='';el.classList.remove('sw-ok','sw-no');setTimeout(()=>{el._sw=false},0)}
  };
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}

let Q=null;const QN=15;

function gen(){for(let t=0;t<40;t++){const q=({meaning:genMeaning,syn:genSyn,odd:genOdd})[Q.kind]();if(q)return q}return null}

function groupMini(g,hl){
  return `<div class="mini-g"><div class="mg-h"><span class="gl sm">${g.letter}</span>${esc(g.tr)}<em>${g.test.short}</em></div>
  <div class="mg-w">${g.items.map(x=>`<span class="${hl&&hl.includes(x.w)?'hl':''}">${esc(x.w)}</span>`).join('')}</div></div>`;

function genMeaning(){
  const it=wpick(poolNow()); if(!it) return null;
  const own=byKey.get(it.k);
  const c=distractorGroups(it.g,g=>!own.has(g)&&![...own].some(o=>related(o,g)));
  const trs=new Set([it.g.tr]); const ds=[];
  for(const g of shuffle(c.slice())){if(!trs.has(g.tr)){trs.add(g.tr);ds.push(g)} if(ds.length===3)break}
  if(ds.length<3) return null;
  return {it,
    prompt:`<div class="bigword">${esc(it.w)}</div><button class="speak" onclick="speak(this.dataset.w)" data-w="${esc(it.w)}">🔊</button>`,
    sub:'Bu kelime hangi anlam grubunda yer alıyor?',
    opts:shuffle([{label:it.g.tr,ok:true},...ds.map(g=>({label:g.tr,ok:false,g}))]),
    explain:()=>groupMini(it.g,[it.w])+(own.size>1?`<div class="qsub" style="text-align:left">Bu kelime başka gruplarda da geçiyor:</div>`+[...own].filter(g=>g!==it.g).map(g=>groupMini(g,[it.w])).join(''):''),
    rec:(ok,o)=>{rec(it,ok)}};
}
function genSyn(){
  const it=wpick(poolNow().filter(i=>i.g.items.length>=2)); if(!it) return null;
  const own=byKey.get(it.k);
  const ans=pick(it.g.items.filter(x=>x.k!==it.k)); if(!ans) return null;
  const cg=distractorGroups(it.g,g=>!own.has(g)&&![...own].some(o=>related(o,g)));
  const ws=dedupeK(shuffle(cg.flatMap(g=>g.items))).filter(c=>c.k!==ans.k&&![...own].some(g=>wordRelatedToGroup(c,g))).slice(0,4);
  if(ws.length<4) return null;
  return {it,
    prompt:`<div class="qline">“<b>${esc(it.w)}</b>” means ----.</div>`,
    sub:'Anlamca en yakın kelimeyi seç',
    opts:shuffle([{label:ans.w,ok:true,it:ans},...ws.map(w=>({label:w.w,ok:false,it:w}))]),
    explain:(o)=>groupMini(it.g,[it.w,ans.w])+(o&&!o.ok?groupMini(o.it.g,[o.it.w]):''),
    rec:(ok)=>{rec(it,ok);rec(ans,ok,true)}};
}
function genOdd(){
  const it=wpick(poolNow().filter(i=>dedupeK(i.g.items).length>=3)); if(!it) return null;
  const g=it.g;
  const three=[it,...sample(dedupeK(g.items).filter(x=>x.k!==it.k),2)];
  const cg=distractorGroups(g,x=>!related(x,g)); if(!cg.length) return null;
  const og=pick(cg);
  const odd=pick(og.items.filter(x=>!wordRelatedToGroup(x,g)&&!three.some(t=>byKey.get(t.k).has(og))));
  if(!odd) return null;
  return {it,
    prompt:`<div class="qline" style="font-size:clamp(20px,4vw,28px)">Hangisi diğerleriyle <b>aynı anlam grubunda değil</b>?</div>`,
    sub:'Üç kelime eş anlamlı, biri farklı',
    opts:shuffle([...three.map(x=>({label:x.w,ok:false,it:x})),{label:odd.w,ok:true,it:odd}]),
    explain:()=>groupMini(g,three.map(x=>x.w))+groupMini(og,[odd.w]),
    rec:(ok)=>{three.forEach(x=>rec(x,ok,true));rec(odd,ok,true)}};
}
function drawQuiz(){
  const k=Q.kind;
  if(!Q.cur){$('#view').innerHTML=`<div class="stage">${emptyState()}</div>`;return}
  if(Q.i>=QN){
    const pct=Math.round(Q.score/QN*100);
    const miss=dedupeK(Q.missed);
    const msg=pct>=90?'Mükemmel! 🏆':pct>=70?'Çok iyi gidiyor! 💪':pct>=50?'Fena değil, devam!':'Tekrar zamanı 📚';
    $('#view').innerHTML=`<div class="stage"><div class="panel sum"><div class="ring" style="--v:${pct}"><div>${Q.score}/${QN}</div></div>
      <h2>${msg}</h2><p>${QTITLE[k]} tamamlandı · %${pct} başarı</p>
      <div class="row"><button class="big primary" onclick="newQuiz('${k}');drawQuiz()">Yeni tur</button>
      ${miss.length?`<button class="big again" onclick="newQuiz('${k}',Q.missed.slice());drawQuiz()">Yanlışları tekrar et (${miss.length})</button>`:''}</div>
      ${miss.length?`<div class="missed"><div class="qsub" style="text-align:left">Kaçırdıkların:</div>${[...new Set(miss.map(m=>m.g))].map(g=>groupMini(g,miss.map(m=>m.w))).join('')}</div>`:''}
    </div></div>`;
    return;
  }
  const q=Q.cur,a=Q.ans;
  const opts=q.opts.map((o,i)=>{
    let cls='';if(a!=null){if(o.ok)cls='good';else if(i===a)cls='badc';else cls='dim'}
    return `<button class="opt ${cls}" ${a!=null?'disabled':''} onclick="answer(${i})"><span class="k">${'ABCDE'[i]}</span>${esc(o.label)}</button>`}).join('');
  let ex='';
  if(a!=null){const ok=q.opts[a].ok;
    ex=`<div class="explain"><div class="verdict ${ok?'ok':'no'}">${ok?'✓ Doğru!':'✗ Doğru cevap: '+esc(q.opts.find(o=>o.ok).label)}</div>
      <button class="big primary" id="nextBtn" onclick="nextQ()">${Q.i+1>=QN?'Sonuçları gör':'Sonraki soru'} →<kbd>Enter</kbd></button>${q.explain(q.opts[a])}</div>`}
  $('#view').innerHTML=`<div class="stage">
    <div class="meta"><span>${QTITLE[k]} · Soru <b>${Q.i+1}</b> / ${QN}</span><span>Puan <b>${Q.score}</b></span></div>
    <div class="bar"><i style="width:${(Q.i+(a!=null?1:0))/QN*100}%"></i></div>
    <div class="qcard"><div class="ftag">${q.it.g.test.short}</div>${q.prompt}<div class="qsub">${q.sub}</div></div>
    <div class="opts">${opts}</div>${ex}</div>`;
}
function answer(i){
  if(Q.ans!=null)return;Q.ans=i;const q=Q.cur,o=q.opts[i];
  if(o.ok)Q.score++;else Q.missed.push(q.it);
  q.rec(o.ok,o);tally(o.ok);drawQuiz();
  const nb=$('#nextBtn');if(nb&&isMobile())nb.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function nextQ(){Q.i++;Q.ans=null;if(Q.i<QN)Q.cur=gen();drawQuiz();drawScope();toView()}

let B=null;const BN=10;
function viewBuild(){if(!B||B.sig!==sigOf()) newBuild();drawBuild()}
function newBuild(){B={sig:sigOf(),i:0,score:0};B.cur=genBuild()}
function genBuild(){
  const {its}=scope();
  for(let t=0;t<30;t++){
    const it=wpick(its.filter(i=>dedupeK(i.g.items).length>=3)); if(!it) return null;
    const g=it.g; const uniq=dedupeK(g.items);
    const right=sample(uniq,Math.min(6,uniq.length));
    const cg=distractorGroups(g,x=>!related(x,g));
    const wrong=dedupeK(shuffle(cg.flatMap(x=>x.items))).filter(c=>!wordRelatedToGroup(c,g)&&!right.some(r=>r.k===c.k)).slice(0,10-right.length);
    if(wrong.length<3) continue;
    return {g,chips:shuffle([...right.map(x=>({it:x,ok:true})),...wrong.map(x=>({it:x,ok:false}))]),picked:new Set(),checked:false};
  }
  return null;
}
function drawBuild(){
  if(!B.cur){$('#view').innerHTML=`<div class="stage">${emptyState()}</div>`;return}
  if(B.i>=BN){
    const pct=Math.round(B.score/BN*100);
    $('#view').innerHTML=`<div class="stage"><div class="panel sum"><div class="ring" style="--v:${pct}"><div>${B.score}/${BN}</div></div>
      <h2>${pct>=80?'Gruplar senden sorulur! 🧱':'İyi antrenman!'}</h2><p>${BN} grubun ${B.score} tanesini eksiksiz kurdun</p>
      <div class="row"><button class="big primary" onclick="newBuild();drawBuild()">Yeni tur</button></div></div></div>`;return;
  }
  const c=B.cur,nRight=c.chips.filter(x=>x.ok).length;
  const chips=c.chips.map((x,i)=>{
    let cls=c.picked.has(i)?'sel':'';
    if(c.checked){cls=x.ok?(c.picked.has(i)?'good':'miss'):(c.picked.has(i)?'bad':'dim')}
    return `<button class="bchip ${cls}" ${c.checked?'disabled':''} onclick="pickB(${i})">${esc(x.it.w)}</button>`}).join('');
  let foot;
  if(!c.checked) foot=`<button class="big primary stickybtn" onclick="checkB()">Kontrol et<kbd>Enter</kbd></button>`;
  else{
    const hits=c.chips.filter((x,i)=>x.ok&&c.picked.has(i)).length,bad=c.chips.filter((x,i)=>!x.ok&&c.picked.has(i)).length;
    const perfect=hits===nRight&&!bad;
    const wrongs=c.chips.filter((x,i)=>!x.ok&&c.picked.has(i));
    foot=`<div class="explain"><div class="verdict ${perfect?'ok':'no'}">${perfect?'✓ Kusursuz!':`${hits}/${nRight} doğru seçim${bad?` · ${bad} yanlış seçim`:''}`}</div>
      ${wrongs.length?`<div class="wrongs"><div class="wh">Yanlış seçtiklerinin anlamı</div>${wrongs.map(x=>`<div class="wi"><b>${esc(x.it.w)}</b><span>${[...byKey.get(x.it.k)].map(g=>esc(g.tr)+` <em>${g.test.short}</em>`).join('<br>')}</span></div>`).join('')}</div>`:''}
      <button class="big primary" id="nextBtn" onclick="nextB()">${B.i+1>=BN?'Sonuçları gör':'Sonraki grup'} →<kbd>Enter</kbd></button>${groupMini(c.g,c.chips.filter(x=>x.ok).map(x=>x.it.w))}</div>`;
  }
  $('#view').innerHTML=`<div class="stage">
    <div class="meta"><span>Grup Kur · <b>${B.i+1}</b> / ${BN}</span><span>Puan <b>${B.score}</b></span></div>
    <div class="bar"><i style="width:${(B.i+(c.checked?1:0))/BN*100}%"></i></div>
    <div class="qcard"><div class="ftag">${c.g.test.short}</div><div class="qsub" style="margin:0 0 8px">Bu anlama gelen <b style="color:var(--text)">${nRight}</b> kelimeyi seç</div>
      <div class="bigtr" style="font-size:clamp(20px,4vw,30px)">${esc(c.g.tr)}</div></div>
    <div class="bchips">${chips}</div>${foot}</div>`;
}
function pickB(i){const c=B.cur;c.picked.has(i)?c.picked.delete(i):c.picked.add(i);drawBuild()}
function checkB(){
  const c=B.cur;if(c.checked)return;c.checked=true;
  let perfect=true;
  c.chips.forEach((x,i)=>{const p=c.picked.has(i);if(x.ok){rec(x.it,p,true);if(!p)perfect=false}else if(p){perfect=false}});
  if(perfect)B.score++;tally(perfect);drawBuild();
  const nb=$('#nextBtn');if(nb&&isMobile())nb.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function nextB(){B.i++;if(B.i<BN)B.cur=genBuild();drawBuild();drawScope();toView()}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(S.mode==='flash'&&F&&F.i<F.deck.length){
    if(e.code==='Space'||e.key==='Enter'){e.preventDefault();flip()}
    else if(e.key==='ArrowLeft'||e.key==='1')grade(false);
    else if(e.key==='ArrowRight'||e.key==='3')grade(true);
    else if(e.key==='ArrowDown'||e.key==='2'||e.key==='n'){e.preventDefault();skipCard()}
  }else if(['meaning','syn','odd'].includes(S.mode)&&Q&&Q.cur&&Q.i<QN){
    const n=parseInt(e.key);
    if(n>=1&&n<=Q.cur.opts.length)answer(n-1);
    else if(/^[a-e]$/i.test(e.key)&&'abcde'.indexOf(e.key.toLowerCase())<Q.cur.opts.length)answer('abcde'.indexOf(e.key.toLowerCase()));
    else if(e.key==='Enter'&&Q.ans!=null){e.preventDefault();nextQ()}
  }else if(S.mode==='build'&&B&&B.cur&&B.i<BN&&e.key==='Enter'){e.preventDefault();B.cur.checked?nextB():checkB()}
});
function resetProg(btn){
  if(!btn.classList.contains('armed')){btn.classList.add('armed');btn.textContent='Emin misin? Tekrar tıkla';setTimeout(()=>{btn.classList.remove('armed');btn.textContent='İlerlemeyi sıfırla'},3000);return}
  P={};LS.set('ka_prog',P);streak=best=sessionOk=sessionAll=0;btn.classList.remove('armed');btn.textContent='İlerlemeyi sıfırla';F=Q=B=null;render();toast('İlerleme sıfırlandı');
}
render();
</script>
